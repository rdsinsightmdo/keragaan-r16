<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<title>Masuk · Keragaan Region 16</title>
<style>
:root{
  --bg:#f3f7fc; --surface:#ffffff; --surface-2:#eef3fa; --border:#dce5f1;
  --text:#13233d; --muted:#52627a; --faint:#8593a8;
  --accent:#0857C3; --accent-soft:#e3eefb; --on-accent:#ffffff;
  --brand-grad:linear-gradient(120deg,#0857C3 0%,#307FE2 65%,#71C5E8 130%); --bad:#b3261e; --bad-bg:#fbe0dd;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1526; --surface:#0f1f38; --surface-2:#152a4a; --border:#23395c;
    --text:#e6eef9; --muted:#a4b4cb; --faint:#7487a3;
    --accent:#71C5E8; --accent-soft:#16345c; --on-accent:#0a1526;
    --brand-grad:linear-gradient(120deg,#06408f 0%,#0857C3 60%,#307FE2 130%); --bad:#ff8f86; --bad-bg:#44201d;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1526; --surface:#0f1f38; --surface-2:#152a4a; --border:#23395c;
  --text:#e6eef9; --muted:#a4b4cb; --faint:#7487a3;
  --accent:#71C5E8; --accent-soft:#16345c; --on-accent:#0a1526;
  --brand-grad:linear-gradient(120deg,#06408f 0%,#0857C3 60%,#307FE2 130%); --bad:#ff8f86; --bad-bg:#44201d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--brand-grad);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 24px 22px;box-shadow:0 12px 40px rgba(4,30,70,.28)}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:14px}
h1{font-size:18px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin:4px 0 20px}
label{display:block;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.pin{width:100%;font:inherit;font-size:19px;letter-spacing:.12em;text-align:center;padding:12px 48px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);outline:none}
.pin:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pinwrap{position:relative}
.pinwrap .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:6px;background:transparent;color:var(--muted);border-radius:8px;line-height:0}
.pinwrap .eye:hover{background:var(--accent-soft);color:var(--accent)}
button{width:100%;margin-top:14px;padding:11px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;margin-top:12px;font-size:13px;text-align:center}
.msg.err{color:var(--bad)}
.foot{margin-top:16px;padding-top:12px;border-top:1px dashed var(--border);font-size:11.5px;color:var(--faint);text-align:center}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div class="logo" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
  </div>
  <h1>Keragaan Region 16 Manado</h1>
  <div class="sub">Dashboard internal. Masukkan PIN untuk melanjutkan.</div>
  <label for="pin">PIN (huruf / angka)</label>
  <div class="pinwrap">
    <input class="pin" id="pin" type="password" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus maxlength="64" required>
    <button class="eye" id="eye" type="button" aria-label="Tampilkan PIN" title="Tampilkan PIN"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <button id="btn" type="submit">Masuk</button>
  <div class="msg" id="msg"></div>
  <div class="foot">Sesi berakhir saat browser ditutup atau 30 menit tidak aktif.</div>
</form>
<script src="lib/crypto-fallback.js"></script>
<script src="lib/auth.js"></script>
<script>
const EYE='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>', EYEOFF='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.8 10.8 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.1-5.9M9.9 5.2A9.1 9.1 0 0 1 12 5c6.5 0 10 7 10 7a18.6 18.6 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M2 2l20 20"/></svg>';
document.getElementById('eye').onclick=()=>{const p=document.getElementById('pin'),e=document.getElementById('eye'); const show=p.type==='password'; p.type=show?'text':'password'; e.innerHTML=show?EYEOFF:EYE; e.title=show?'Sembunyikan PIN':'Tampilkan PIN'; e.setAttribute('aria-label',e.title); p.focus();};
const f=document.getElementById('f'), pin=document.getElementById('pin'), btn=document.getElementById('btn'), msg=document.getElementById('msg');
try{ const t=localStorage.getItem('kr-theme'); if(t&&t!=='auto') document.documentElement.setAttribute('data-theme',t); }catch(e){}
/* halaman tujuan setelah login: hanya nama file .html lokal (mis. rsf.html), selain itu ke dashboard */
const NEXT=(()=>{ try{ const n=new URLSearchParams(location.search).get('next')||''; if(/^[\w-]+\.html(?:[?#][^\s]*)?$/.test(n)) return n; }catch(e){} return 'index.html'; })();
if(KRA.getKey()) location.replace(NEXT);
try{ if(sessionStorage.getItem('kr-exp')){ sessionStorage.removeItem('kr-exp'); msg.textContent='Sesi berakhir, silakan masukkan PIN lagi.'; } }catch(e){}
let fails=0, lockUntil=0;
f.onsubmit=async e=>{
  e.preventDefault();
  const now=Date.now();
  if(now<lockUntil){ msg.className='msg err'; msg.textContent=`Terlalu banyak percobaan. Coba lagi dalam ${Math.ceil((lockUntil-now)/1000)} detik.`; return; }
  if(!pin.value.trim()) return;
  btn.disabled=true; msg.className='msg'; msg.textContent='Memeriksa PIN…';
  try{
    const ok=await KRA.login(pin.value.trim());
    if(ok){ msg.textContent=NEXT==='index.html'?'Berhasil, membuka dashboard…':'Berhasil, membuka halaman…'; location.replace(NEXT); return; }
    fails++; if(fails>=5){ lockUntil=Date.now()+30000*Math.pow(2,fails-5); }
    msg.className='msg err'; msg.textContent='PIN salah.'+(fails>=5?' Tunggu sebentar sebelum mencoba lagi.':'');
    pin.value=''; pin.focus();
  }catch(err){ msg.className='msg err'; msg.textContent=err.message||String(err); }
  btn.disabled=false;
};
</script>
</body>
</html>
